# TEACHING MATERIAL. DO NOT USE THIS WORKFLOW IN A REAL REPOSITORY.
# It contains three deliberately planted security weaknesses for Exercise 29.4 (Module 29).
# Find them, name their class, and fix them. The analysis is in solutions/exercises-m26-m31.md.
# Assembled from documented syntax and parse-checked with PyYAML; never executed on GitHub.
#
# What it does: in a PUBLIC repository, runs the model evaluation for every pull request on
# the team's own GPU machine, which is registered as a persistent self-hosted runner.

name: GPU evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate on the GPU box
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Debug - show the whole context
        env:
          CONTEXT: ${{ toJSON(github) }}
        run: echo "$CONTEXT"

      - name: Run the evaluation
        run: |
          curl -fsSL https://example.com/install-eval-tools.sh | bash
          python eval/run.py --model checkpoints/latest
