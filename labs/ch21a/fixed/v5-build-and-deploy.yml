# Reference fix for Lab 29.1 (see solutions/m29-vulnerable-workflows.md).
# Assembled from documented syntax and parse-checked with PyYAML; never executed on GitHub.
#
# What it does: on every push to main, lints, tests, and then runs the simulated deployment
# to staging with a deployment token.

name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest

  deploy:
    name: Deploy to staging
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy (simulated)
        env:
          DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: bash scripts/deploy.sh staging
