# Workflow 7: create an artifact in one job and consume it in a later job.
#
# Teaches: every job starts on a new machine, so files cross jobs only as artifacts;
# upload outputs (artifact ID and digest) passed on through job outputs and `needs`;
# a retention period per artifact; the digest check on download; a simulated deployment
# that deploys exactly the files that were built and tested.
# Chapter 20A, sections 20A.12 and 20A.13. Lab 26.7. Chapter 20B deploys this artifact
# to environments.
#
# Copy to .github/workflows/07-artifact.yml in the inventory-api practice repository.
# Parse-checked and assembled from documented syntax; not executed on GitHub by the author.

name: Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - name: Build
        run: uv build

      - name: Upload the build outputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inventory-api-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-simulated:
    name: Simulated deployment
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This job needs the deployment script from the repository, and the files from the build job.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inventory-api-dist
          path: dist

      - name: Show what arrived
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          echo "artifact ID     : $ARTIFACT_ID"
          echo "artifact digest : $ARTIFACT_DIGEST"
          ls dist

      - name: Deploy (simulated)
        run: bash scripts/deploy.sh staging dist
