# Broken workflow 5 of 6 (Lab 28.1): continuous integration on every branch.
#
# Intended behavior: run the tests on every push to any branch. When a developer pushes twice in
# a row to the same branch, the older run of that branch should stop, because its result is no
# longer interesting.
#
# Observed: read the lab. Diagnose before you change anything.
# Parse-checked and assembled from documented syntax. Not executed on GitHub by the author.

name: Branch CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"

      - run: uv sync --locked
      - run: uv run pytest
