# Reference fix for Lab 29.1 (see solutions/m29-vulnerable-workflows.md).
# Assembled from documented syntax and parse-checked with PyYAML; never executed on GitHub.
#
# What it does: checks formatting and lint rules on every pull request.

name: format-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .
