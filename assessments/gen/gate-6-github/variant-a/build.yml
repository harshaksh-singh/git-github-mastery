# The other workflow of acme-pay/ledger. Constructed for Gate 6: it is teaching material and
# contains the fault that case 1 asks about. Do not copy it.
# History: the package directory was renamed from src/ to ledger/ in March.
name: build

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m build
