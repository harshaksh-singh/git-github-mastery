# TEACHING MATERIAL. DO NOT USE THIS WORKFLOW IN A REAL REPOSITORY.
# It contains three deliberately planted security weaknesses for Exercise 29.2 (Module 29).
# Find them, name their class, and fix them. The analysis is in solutions/exercises-m26-m31.md.
# Assembled from documented syntax and parse-checked with PyYAML; never executed on GitHub.
#
# What it does: after the unprivileged "CI" workflow has finished for a pull request, this
# privileged workflow downloads the report that CI uploaded and posts it as a comment.
# CI uploads an artifact "pr-report" that contains two files: number.txt and summary.md.

name: Comment the CI report

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  comment:
    name: Post the report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the report of the run that just finished
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the pull request number
        id: pr
        run: echo "number=$(cat report/number.txt)" >> "$GITHUB_OUTPUT"

      - name: Post the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} --repo "$GITHUB_REPOSITORY" --body-file report/summary.md
