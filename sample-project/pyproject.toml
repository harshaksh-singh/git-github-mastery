[project]
name = "inventory-api"
version = "0.1.0"
description = "Stock arithmetic for a small inventory service. The sample project of the Git and GitHub mastery course."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["java-service"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
