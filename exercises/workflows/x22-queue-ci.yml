# TEACHING MATERIAL for Exercise 22.3 (Module 22). This workflow has one planted flaw.
# It is not a security weakness: the file is safe to read and unsafe to rely on.
# Find the flaw from the situation the exercise describes. The analysis is in
# solutions/exercises-m19-m25.md.
# Assembled from documented syntax and parse-checked with PyYAML; never executed on GitHub.
#
# What it does: runs the unit tests of the inventory-api practice repository. A ruleset on
# main requires the status check "ci", and the team has just enabled a merge queue on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run the tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
