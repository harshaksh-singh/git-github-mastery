# Case 1 of Gate 8, variant A. Constructed for the gate: this workflow is teaching material.
# It is insecure on purpose, in ways that Chapter 21A documents. Do not copy it and do not run it.
# The action "some-org/setup-docs-toolchain" is invented; no such repository is meant.
name: preview-docs

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

env:
  PREVIEW_BUCKET_KEY: ${{ secrets.PREVIEW_BUCKET_KEY }}

jobs:
  preview:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - name: Announce
        run: |
          echo "Building the preview for: ${{ github.event.pull_request.title }}"
      - uses: some-org/setup-docs-toolchain@v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/docs
          key: docs-${{ runner.os }}
      - name: Build
        run: make docs
      - name: Upload the preview
        run: make upload-preview
