# Constructed for incident 7 of the course. This is the workflow file of the project
# "eval-reports" as it was when the failure was reported. It was assembled from documented
# syntax and parse-checked with PyYAML. It was not executed on GitHub.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compute version
        run: |
          version="$(bash scripts/version.sh)"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: python3 -m unittest discover -s tests
